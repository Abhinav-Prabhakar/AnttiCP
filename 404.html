<!DOCTYPE html>

<head>

<title>Page not found · Guide to Competitive Programming</title>

<meta name="theme-color" id="themeColor" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23171717'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='22' fill='white' text-anchor='middle'%3E404%3C/text%3E%3C/svg%3E">
<script>
(function () {
  try {
    var saved = localStorage.getItem('cp-theme');
    var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    var meta = document.getElementById('themeColor');
    if (meta) meta.setAttribute('content', dark ? '#0e0e0d' : '#ffffff');
  } catch (error) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
<style>

</header>
<main>
  <span class="kicker">404 · Not in the book</span>

  <p>This page is not part of the edition. The book is fifteen chapters, and they are all still where they were.</p>

<footer>Guide to Competitive Programming · Interactive edition</footer>
<script>
  var btn = document.getElementById('themeBtn');
  var meta = document.getElementById('themeColor');
  function paint(theme) {
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e0e0d' : '#ffffff');
    var next = theme === 'dark' ? 'light' : 'dark';
    btn.textContent = next === 'dark' ? 'Dark' : 'Light';
    btn.setAttribute('aria-label', 'Switch to ' + next + ' mode');
  }
  paint(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
  btn.addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('cp-theme', next); } catch (error) { /* ignore */ }
    paint(next);
  });
</script>
</body>
